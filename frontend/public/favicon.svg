<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Rounded Squircle Background -->
  <rect width="100" height="100" rx="24" fill="url(#bgGrad)" />
  
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="pageGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Graduation Cap (Diamond Top) -->
  <path d="M50 18 L82 32 L50 46 L18 32 Z" fill="#ffffff" />
  <!-- Graduation Cap Underside / Depth -->
  <path d="M50 46 L82 32 L82 36 L50 50 L18 36 L18 32 Z" fill="#bfdbfe" />
  
  <!-- Golden Star of Excellence in Center of Cap -->
  <path d="M50 25 L52 29.5 L57 31 L52 32.5 L50 37 L48 32.5 L43 31 L48 29.5 Z" fill="url(#goldGrad)" filter="url(#glow)" />
  
  <!-- Cap Tassel -->
  <path d="M74 35.5 C75 40, 77 46, 76 53" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round" fill="none" />
  <circle cx="76" cy="55" r="2.5" fill="url(#goldGrad)" />
  <path d="M73.5 55 L78.5 55 L79.5 63 L72.5 63 Z" fill="url(#goldGrad)" />

  <!-- Open Book Pages (Bottom) -->
  <!-- Left Page -->
  <path d="M48 54 C38 51, 26 53, 20 58 L20 74 C26 69, 38 67, 48 70 Z" fill="url(#pageGrad)" />
  <!-- Right Page -->
  <path d="M52 54 C62 51, 74 53, 80 58 L80 74 C74 69, 62 67, 52 70 Z" fill="url(#pageGrad)" />
  
  <!-- Book Spine Center Line -->
  <line x1="50" y1="51" x2="50" y2="72" stroke="#93c5fd" stroke-width="2.5" stroke-linecap="round" />
  
  <!-- Subtle Page Lines on Left Page -->
  <line x1="26" y1="63" x2="42" y2="60" stroke="#3b82f6" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.4" />
  <line x1="26" y1="67" x2="42" y2="64" stroke="#3b82f6" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.4" />

  <!-- Subtle Page Lines on Right Page -->
  <line x1="58" y1="60" x2="74" y2="63" stroke="#3b82f6" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.4" />
  <line x1="58" y1="64" x2="74" y2="67" stroke="#3b82f6" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.4" />
</svg>